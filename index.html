<title>ثبت سفارش</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f5f1;--card:#fff;--tx:#1f2328;--mut:#6b7280;--ac:#14532d;--acx:#fff;--bd:#e5e2d9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--card:#1f2428;--tx:#eceff1;--mut:#9aa4ad;--ac:#4ade80;--acx:#06201d;--bd:#2f363c}}
:root[data-theme="dark"]{--bg:#15181b;--card:#1f2428;--tx:#eceff1;--mut:#9aa4ad;--ac:#4ade80;--acx:#06201d;--bd:#2f363c}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:22px;margin:8px 0 4px}p.s{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;margin:10px 0 4px}
input,textarea{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:var(--acx);font-weight:600}
button.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.full{width:100%;margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.p{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.p img{width:100%;aspect-ratio:2/3;object-position:top;object-fit:cover;display:block}
.p div.b{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.p b{font-size:15px}.pr{color:var(--mut);font-size:13px}
.q{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.q button{padding:4px 14px;font-size:18px;line-height:1.4}
.bar{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:1px solid var(--bd);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0}
.ok{text-align:center;padding:30px 10px}.ok .e{font-size:54px}
.err{color:#dc2626;font-size:13px;min-height:18px}
.hide{display:none}
.ord{border-top:1px dashed var(--bd);padding:8px 0;font-size:14px}
</style>
</head>

// ============================================
function img(p){
  var s='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="'+p.c+'" opacity=".22"/><text x="100" y="125" font-size="90" text-anchor="middle">'+p.emoji+'</text></svg>';
  return p.img || 'data:image/svg+xml;utf8,'+encodeURIComponent(s);
}
var fa=function(n){return Number(n).toLocaleString("fa-IR")};
var st={step:0,name:"",phone:"",note:"",cart:{},err:"",sent:null};
var db=null,uid=null;
document.getElementById("title").textContent=STORE_NAME;
document.title=STORE_NAME;
var $=document.getElementById("app");

function total(){var t=0,n=0;PRODUCTS.forEach(function(p){var q=st.cart[p.id]||0;t+=q*p.price;n+=q});return{t:t,n:n}}
function normPhone(v){return v.replace(/[۰-۹]/g,function(d){return "۰۱۲۳۴۵۶۷۸۹".indexOf(d)}).replace(/[٠-٩]/g,function(d){return "٠١٢٣٤٥٦٧٨٩".indexOf(d)}).replace(/\D/g,"")}

function render(){
  var h="",T=total();
  document.getElementById("sub").textContent=st.step==0?"ابتدا مشخصات خود را وارد کنید":st.step==1?"محصول مورد نظر را انتخاب کنید":st.step==2?"بررسی و تأیید سفارش":"";
  if(st.step==0){
    h='<div class="card"><label>نام و نام خانوادگی</label><input id="nm" value="'+esc(st.name)+'" autocomplete="name">'+
      '<label>شماره تلفن همراه</label><input id="ph" type="tel" inputmode="numeric" placeholder="۰۹۱۲۳۴۵۶۷۸۹" value="'+esc(st.phone)+'" dir="ltr" style="text-align:right" autocomplete="tel">'+
      '<div class="err">'+st.err+'</div><button class="full" id="go1">ادامه و مشاهده محصولات</button></div>';
  }else if(st.step==1){
    h='<div class="grid">'+PRODUCTS.map(function(p){var q=st.cart[p.id]||0;
      return '<div class="p"><img src="'+img(p)+'" alt=""><div class="b"><b>'+esc(p.name)+'</b><span class="pr">'+(p.price?fa(p.price)+' '+CURRENCY:'قیمت: استعلام')+'</span>'+
      '<div class="q"><button data-a="+" data-id="'+p.id+'">+</button><b>'+fa(q)+'</b><button class="g" data-a="-" data-id="'+p.id+'">−</button></div></div></div>'}).join("")+'</div>'+
      '<div class="bar"><div><div><div style="font-size:13px;color:var(--mut)">'+fa(T.n)+' عدد</div><b>'+(T.t?fa(T.t)+' '+CURRENCY:'قیمت پس از تأیید')+'</b></div><button id="go2" '+(T.n?'':'disabled style="opacity:.5"')+'>مرحله بعد</button></div></div>';
  }else if(st.step==2){
    h='<div class="card"><b>'+esc(st.name)+'</b> — <span dir="ltr">'+esc(st.phone)+'</span></div><div class="card">'+
      PRODUCTS.filter(function(p){return st.cart[p.id]}).map(function(p){return '<div class="row"><span>'+esc(p.name)+' × '+fa(st.cart[p.id])+'</span><span>'+(p.price?fa(st.cart[p.id]*p.price):'')+'</span></div>'}).join("")+
      '<div class="row" style="border-top:1px solid var(--bd);margin-top:6px;padding-top:8px"><b>جمع کل</b><b>'+(T.t?fa(T.t)+' '+CURRENCY:'پس از تأیید')+'</b></div></div>'+
      '<div class="card"><label>سایز و توضیحات (اختیاری)</label><textarea id="nt" rows="2">'+esc(st.note)+'</textarea></div><div class="err">'+st.err+'</div>'+
      '<button class="full" id="send">ثبت نهایی سفارش</button><button class="full g" id="back">بازگشت و ویرایش</button>';
  }else{
    h='<div class="card ok"><div class="e">✅</div><h2>سفارش شما ثبت شد</h2><p class="s">کد پیگیری: <b>'+fa(st.sent.code)+'</b></p>'+
      (st.sent.db?'':'<p class="err" style="font-size:14px">برای اطمینان از رسیدن سفارش، دکمهٔ زیر را بزنید.</p>')+
      (OWNER_WA?'<a href="'+waLink()+'" target="_blank" rel="noopener"><button class="full">ارسال سفارش از طریق واتساپ</button></a>':'')+
      '<button class="full g" id="again">سفارش جدید</button></div>';
  }
  $.innerHTML=h;bind();
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function summary(code){
  var L=["سفارش جدید #"+code,"نام: "+st.name,"تلفن: "+st.phone,""];
  PRODUCTS.forEach(function(p){if(st.cart[p.id])L.push("• "+p.name+" × "+st.cart[p.id])});
  if(total().t)L.push("","جمع: "+total().t.toLocaleString("fa-IR")+" "+CURRENCY);if(st.note)L.push("توضیح: "+st.note);
  return L.join("\n");
}
function waLink(){return "https://wa.me/"+OWNER_WA+"?text="+encodeURIComponent(summary(st.sent.code))}
function bind(){
  var q=function(i){return document.getElementById(i)};
  if(q("go1"))q("go1").onclick=function(){
    st.name=q("nm").value.trim();st.phone=normPhone(q("ph").value);
    if(st.name.length<3){st.err="نام را کامل وارد کنید";return render()}
    if(!/^09\d{9}$/.test(st.phone)){st.err="شماره موبایل باید ۱۱ رقم و با ۰۹ شروع شود";return render()}
    st.err="";st.step=1;render();
  };
  $.querySelectorAll("[data-a]").forEach(function(b){b.onclick=function(){
    var id=b.dataset.id,c=st.cart[id]||0;c+=b.dataset.a=="+"?1:-1;if(c<=0)delete st.cart[id];else st.cart[id]=c;
    var y=window.scrollY;render();window.scrollTo(0,y);
  }});
  if(q("go2"))q("go2").onclick=function(){st.step=2;render();window.scrollTo(0,0)};
  if(q("back"))q("back").onclick=function(){st.note=q("nt").value;st.step=1;render()};
  if(q("again"))q("again").onclick=function(){st.cart={};st.note="";st.step=1;render()};
  if(q("send"))q("send").onclick=async function(){
    st.note=q("nt").value;q("send").disabled=true;q("send").textContent="در حال ثبت...";
    var code=Math.floor(10000+Math.random()*90000),saved=false;
    var items=PRODUCTS.filter(function(p){return st.cart[p.id]}).map(function(p){return{name:p.name,price:p.price,qty:st.cart[p.id]}});
    try{
      if(db){await db.doc("orders/"+Date.now()+"-"+code).set({code:code,name:st.name,phone:st.phone,note:st.note,items:items,total:total().t,at:new Date().toISOString(),done:false});saved=true}
    }catch(e){saved=false}
    if(!saved&&!OWNER_WA){st.err="ثبت سفارش انجام نشد. لطفاً دوباره تلاش کنید.";st.step=2;return render()}
    st.sent={code:code,db:saved};st.step=3;render();
  };
}
render();

// ===== اتصال به پایگاه داده و پنل مدیر =====
(async function(){
  try{
    db=await claude.use("db");
    var user=await claude.use("user");
    if(db&&user&&user.isOwner()){
      var A=document.getElementById("admin");A.classList.remove("hide");
      db.collection("orders").onSnapshot(function(s){
        var d=s.docs.map(function(x){return x.data()}).sort(function(a,b){return (b.at||"").localeCompare(a.at||"")});
        A.innerHTML='<div class="card"><b>📥 سفارش‌های دریافتی ('+fa(d.length)+')</b>'+(d.length?"":'<p class="s">هنوز سفارشی ثبت نشده.</p>')+
        d.map(function(o){return '<div class="ord"><b>#'+fa(o.code)+'</b> — '+esc(o.name)+' — <span dir="ltr">'+esc(o.phone)+'</span><br>'+
        (o.items||[]).map(function(i){return esc(i.name)+' × '+fa(i.qty)}).join("، ")+'<br>جمع: '+fa(o.total)+' '+CURRENCY+(o.note?'<br>توضیح: '+esc(o.note):'')+'</div>'}).join("")+'</div>';
      });
    }
  }catch(e){}
})();
</script>
</body>
</html>
